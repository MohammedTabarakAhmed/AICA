# Training task (BRD 13 practice run). Never part of the golden suite.
id = "train-email-check"
version = 1
kind = "agent"
description = "is_valid_email() accepts anything containing @"
tags = ["python", "bugfix", "validation"]
task = "The test suite fails. Fix src/emails.py so every test passes, then run the suite."
verify = "{python} -m pytest tests -q -p no:cacheprovider"
verify_kind = "unit"
max_steps = 12
max_seconds = 300

[files]
"src/__init__.py" = ""
"src/emails.py" = "\"\"\"Email addresses.\"\"\"\n\n\ndef is_valid_email(text: str) -> bool:\n    \"\"\"Exactly one @, a non-empty local part, and a domain containing a dot.\"\"\"\n    return \"@\" in text\n"
"tests/test_emails.py" = "import pytest\n\nfrom src.emails import is_valid_email\n\n\ndef test_valid() -> None:\n    assert is_valid_email(\"a@b.co\")\n\n\n@pytest.mark.parametrize(\"text\", [\"a@b\", \"@b.co\", \"a@@b.co\", \"ab.co\"])\ndef test_invalid(text: str) -> None:\n    assert not is_valid_email(text)\n"
