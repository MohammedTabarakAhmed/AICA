id = "train-roman-numerals"
version = 1
kind = "agent"
description = "to_roman() lacks the subtractive forms"
tags = ["python", "bugfix", "algorithms"]
task = "The test suite fails. Fix src/roman.py so every test passes, then run the suite."
verify = "{python} -m pytest tests -q -p no:cacheprovider"
verify_kind = "unit"
