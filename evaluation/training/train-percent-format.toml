# Training task (BRD 13 practice run). Never part of the golden suite.
id = "train-percent-format"
version = 1
kind = "agent"
description = "percent() must scale a fraction to a percentage"
tags = ["python", "bugfix", "formatting"]
task = "The test suite fails. Fix src/percents.py so every test passes, then run the suite."
verify = "{python} -m pytest tests -q -p no:cacheprovider"
verify_kind = "unit"
max_steps = 12
max_seconds = 300

[files]
"src/__init__.py" = ""
"src/percents.py" = "\"\"\"Percentages.\"\"\"\n\n\ndef percent(fraction: float) -> str:\n    \"\"\"0.1234 -> \"12.3%\" (one decimal place).\"\"\"\n    return f\"{fraction:.1f}%\"\n"
"tests/test_percents.py" = "from src.percents import percent\n\n\ndef test_percent() -> None:\n    assert percent(0.1234) == \"12.3%\"\n\n\ndef test_whole() -> None:\n    assert percent(1) == \"100.0%\"\n"
