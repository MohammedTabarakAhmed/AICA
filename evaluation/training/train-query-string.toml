"src/queries.py" = "\"\"\"Query strings.\"\"\"\n\n\ndef parse_query(query: str) -> dict[str, list[str]]:\n    \"\"\"a=1&b=2&a=3 -> {\"a\": [\"1\", \"3\"], \"b\": [\"2\"]}; empty gives {}.\"\"\"\n    out: dict[str, list[str]] = {}\n    for pair in query.split(\"&\"):\n        key, value = pair.split(\"=\")\n        out[key] = [value]\n    return out\n"
"tests/test_queries.py" = "from src.queries import parse_query\n\n\ndef test_repeated() -> None:\n    assert parse_query(\"a=1&b=2&a=3\") == {\"a\": [\"1\", \"3\"], \"b\": [\"2\"]}\n\n\ndef test_empty() -> None:\n    assert parse_query(\"\") == {}\n"
