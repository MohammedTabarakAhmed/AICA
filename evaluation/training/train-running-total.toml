version = 1
kind = "agent"
description = "running_total() resets instead of accumulating"
tags = ["python", "bugfix", "collections"]
task = "The test suite fails. Fix src/totals.py so every test passes, then run the suite."
verify = "{python} -m pytest tests -q -p no:cacheprovider"
verify_kind = "unit"
max_steps = 12
max_seconds = 300

[files]
"src/__init__.py" = ""
"src/totals.py" = "\"\"\"Totals.\"\"\"\n\n\ndef running_total(values: list[int]) -> list[int]:\n    \"\"\"Cumulative sums.\"\"\"\n    out: list[int] = []\n    total = 0\n    for value in values:\n        total = value\n        out.append(total)\n    return out\n"
"tests/test_totals.py" = "from src.totals import running_total\n\n\ndef test_totals() -> None:\n    assert running_total([1, 2, 3]) == [1, 3, 6]\n\n\ndef test_empty() -> None:\n    assert running_total([]) == []\n"
