# Training task (BRD 13 practice run). Never part of the golden suite.
id = "train-invert-mapping"
version = 1
kind = "agent"
description = "invert() silently loses keys that share a value"
tags = ["python", "bugfix", "validation"]
task = "The test suite fails. Fix src/mappings.py so every test passes, then run the suite."
verify = "{python} -m pytest tests -q -p no:cacheprovider"
verify_kind = "unit"
max_steps = 12
max_seconds = 300

[files]
"src/__init__.py" = ""
"src/mappings.py" = "\"\"\"Mappings.\"\"\"\n\n\ndef invert(mapping: dict[str, int]) -> dict[int, str]:\n    \"\"\"Swap keys and values; two keys with the same value are an error.\"\"\"\n    return {v: k for k, v in mapping.items()}\n"
"tests/test_mappings.py" = "import pytest\n\nfrom src.mappings import invert\n\n\ndef test_invert() -> None:\n    assert invert({\"a\": 1, \"b\": 2}) == {1: \"a\", 2: \"b\"}\n\n\ndef test_duplicate_values() -> None:\n    with pytest.raises(ValueError):\n        invert({\"a\": 1, \"b\": 1})\n"
