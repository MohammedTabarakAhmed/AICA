# Training task (BRD 13 practice run). Never part of the golden suite.
id = "train-median-even"
version = 1
kind = "agent"
description = "median() is wrong for lists with an even number of values"
tags = ["python", "bugfix", "math"]
task = "The test suite fails. Fix src/stats.py so every test passes, then run the suite."
verify = "{python} -m pytest tests -q -p no:cacheprovider"
verify_kind = "unit"
max_steps = 12
max_seconds = 300

[files]
"src/__init__.py" = ""
"src/stats.py" = "\"\"\"Descriptive statistics.\"\"\"\n\n\ndef median(values: list[float]) -> float:\n    \"\"\"The middle value of the sorted values.\"\"\"\n    ordered = sorted(values)\n    return ordered[len(ordered) // 2]\n"
"tests/test_stats.py" = "import pytest\n\nfrom src.stats import median\n\n\ndef test_odd() -> None:\n    assert median([3, 1, 2]) == 2\n\n\ndef test_even() -> None:\n    assert median([4, 1, 3, 2]) == 2.5\n\n\ndef test_empty_is_an_error() -> None:\n    with pytest.raises(ValueError):\n        median([])\n"
