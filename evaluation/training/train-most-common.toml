# Training task (BRD 13 practice run). Never part of the golden suite.
id = "train-most-common"
version = 1
kind = "agent"
description = "most_common() must order by count, then alphabetically"
tags = ["python", "bugfix", "collections"]
task = "The test suite fails. Fix src/frequency.py so every test passes, then run the suite."
verify = "{python} -m pytest tests -q -p no:cacheprovider"
verify_kind = "unit"
max_steps = 12
max_seconds = 300

[files]
"src/__init__.py" = ""
"src/frequency.py" = "\"\"\"Word frequency.\"\"\"\n\nfrom collections import Counter\n\n\ndef most_common(words: list[str], n: int) -> list[str]:\n    \"\"\"The n most frequent words; ties in alphabetical order.\"\"\"\n    return sorted(Counter(words))[:n]\n"
"tests/test_frequency.py" = "from src.frequency import most_common\n\n\ndef test_by_count() -> None:\n    assert most_common([\"b\", \"a\", \"b\", \"c\", \"b\", \"c\"], 2) == [\"b\", \"c\"]\n\n\ndef test_ties() -> None:\n    assert most_common([\"z\", \"y\"], 2) == [\"y\", \"z\"]\n"
