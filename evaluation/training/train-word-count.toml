# Training task (BRD 13 practice run). Never part of the golden suite.
id = "train-word-count"
version = 1
kind = "agent"
description = "count_words() counts empty strings between repeated spaces"
tags = ["python", "bugfix", "strings"]
task = "The test suite fails. Fix src/words.py so every test passes, then run the suite."
verify = "{python} -m pytest tests -q -p no:cacheprovider"
verify_kind = "unit"
max_steps = 12
max_seconds = 300

[files]
"src/__init__.py" = ""
"src/words.py" = "\"\"\"Word helpers.\"\"\"\n\n\ndef count_words(text: str) -> int:\n    \"\"\"Number of whitespace-separated words.\"\"\"\n    return len(text.split(\" \"))\n"
"tests/test_words.py" = "from src.words import count_words\n\n\ndef test_simple() -> None:\n    assert count_words(\"a b c\") == 3\n\n\ndef test_repeated_spaces() -> None:\n    assert count_words(\"a  b \\n c\") == 3\n\n\ndef test_empty() -> None:\n    assert count_words(\"\") == 0\n"
