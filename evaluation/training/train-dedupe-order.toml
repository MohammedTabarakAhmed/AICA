# Training task (BRD 13 practice run). Never part of the golden suite.
id = "train-dedupe-order"
version = 1
kind = "agent"
description = "dedupe() must keep the first occurrence order"
tags = ["python", "bugfix", "collections"]
task = "The test suite fails. Fix src/lists.py so every test passes, then run the suite."
verify = "{python} -m pytest tests -q -p no:cacheprovider"
verify_kind = "unit"
max_steps = 12
max_seconds = 300

[files]
"src/__init__.py" = ""
"src/lists.py" = "\"\"\"List helpers.\"\"\"\n\n\ndef dedupe(items: list[str]) -> list[str]:\n    \"\"\"Items without repeats, in the order they first appear.\"\"\"\n    return sorted(set(items))\n"
"tests/test_lists.py" = "from src.lists import dedupe\n\n\ndef test_keeps_order() -> None:\n    assert dedupe([\"b\", \"a\", \"b\", \"c\", \"a\"]) == [\"b\", \"a\", \"c\"]\n\n\ndef test_empty() -> None:\n    assert dedupe([]) == []\n"
