# Training task (BRD 13 practice run). Never part of the golden suite.
id = "train-truncate-ellipsis"
version = 1
kind = "agent"
description = "truncate() result must fit the limit including the ellipsis"
tags = ["python", "bugfix", "strings"]
task = "The test suite fails. Fix src/truncation.py so every test passes, then run the suite."
verify = "{python} -m pytest tests -q -p no:cacheprovider"
verify_kind = "unit"
max_steps = 12
max_seconds = 300

[files]
"src/__init__.py" = ""
"src/truncation.py" = "\"\"\"Truncation.\"\"\"\n\n\ndef truncate(text: str, limit: int) -> str:\n    \"\"\"Text cut to at most limit characters, ending in \"...\" when it was cut.\"\"\"\n    if len(text) <= limit:\n        return text\n    return text[:limit] + \"...\"\n"
"tests/test_truncation.py" = "from src.truncation import truncate\n\n\ndef test_short_text_unchanged() -> None:\n    assert truncate(\"hi\", 8) == \"hi\"\n\n\ndef test_cut() -> None:\n    assert truncate(\"hello world\", 8) == \"hello...\"\n\n\ndef test_fits_limit() -> None:\n    assert len(truncate(\"abcdefghijkl\", 10)) == 10\n"
