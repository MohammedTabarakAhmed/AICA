[files]
"src/__init__.py" = ""
"src/versions.py" = "\"\"\"Versions.\"\"\"\n\n\ndef compare(a: str, b: str) -> int:\n    \"\"\"-1, 0 or 1 comparing dotted numeric versions.\"\"\"\n    return (a > b) - (a < b)\n"
"tests/test_versions.py" = "from src.versions import compare\n\n\ndef test_numeric() -> None:\n    assert compare(\"1.10\", \"1.9\") == 1\n\n\ndef test_equal() -> None:\n    assert compare(\"2.0\", \"2.0\") == 0\n\n\ndef test_less() -> None:\n    assert compare(\"1.2\", \"1.10\") == -1\n"
