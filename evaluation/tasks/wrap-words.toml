[files]
"src/__init__.py" = ""
"src/wrapping.py" = "\"\"\"Text wrapping.\"\"\"\n\n\ndef wrap(text: str, width: int) -> list[str]:\n    \"\"\"Greedy word wrap: lines of at most width characters, never splitting a word\n    shorter than width.\"\"\"\n    return [text[i : i + width] for i in range(0, len(text), width)]\n"
"tests/test_wrapping.py" = "from src.wrapping import wrap\n\n\ndef test_wraps_between_words() -> None:\n    assert wrap(\"the quick brown fox\", 10) == [\"the quick\", \"brown fox\"]\n\n\ndef test_short() -> None:\n    assert wrap(\"hi\", 10) == [\"hi\"]\n\n\ndef test_empty() -> None:\n    assert wrap(\"\", 5) == []\n"
