id = "guard-short-list"
version = 1
kind = "agent"
description = "Fix ratio() so a list shorter than two values raises ValueError"
tags = ["python", "bugfix"]
task = "The test suite fails. Fix src/calc.py so every test passes, then run the suite."
verify = "{python} -m pytest tests -q -p no:cacheprovider"
verify_kind = "unit"
max_steps = 10
max_seconds = 180

scripted = [
  '''{
  "summary": "read, fix, verify",
  "steps": [
    {
      "intent": "read the module",
      "tool": "fs.read",
      "arguments": {
        "path": "src/calc.py"
      }
    },
    {
      "intent": "add the length guard",
      "tool": "fs.edit",
      "arguments": {
        "path": "src/calc.py",
        "old_text": "    return values[0] / values[1]",
        "new_text": "    if len(values) < 2:\n        raise ValueError(\"two values are required\")\n    return values[0] / values[1]"
      }
    },
    {
      "intent": "run the suite",
      "tool": "test.run",
      "arguments": {
        "kind": "unit"
      }
    }
  ],
  "verification": [
    "unit"
  ]
}''',
]

[files]
"src/__init__.py" = ""
"src/calc.py" = """\"\"\"Arithmetic helpers.\"\"\"


def ratio(values: list[float]) -> float:
    \"\"\"Ratio of the first two values.\"\"\"
    return values[0] / values[1]
"""
"tests/test_calc.py" = """import pytest

from src.calc import ratio


def test_ratio() -> None:
    assert ratio([6, 3]) == 2


def test_ratio_rejects_short_input() -> None:
    with pytest.raises(ValueError):
        ratio([1])
"""

# Canned replies for an offline run of the harness itself. With a real model these are ignored.
