# Held-out golden task (EVAL-001). Never used for training (BRD 13).
id = "paginate-one-based"
version = 1
kind = "agent"
description = "page() treats its 1-based page number as 0-based"
tags = ["python", "bugfix", "collections"]
task = "The test suite fails. Fix page in src/paging.py so every test passes, then run the suite."
verify = "{python} -m pytest tests -q -p no:cacheprovider"
verify_kind = "unit"
max_steps = 10
max_seconds = 180

scripted = ["{\n \"summary\": \"read, fix, verify\",\n \"steps\": [\n  {\n   \"intent\": \"read the module\",\n   \"tool\": \"fs.read\",\n   \"arguments\": {\n    \"path\": \"src/paging.py\"\n   }\n  },\n  {\n   \"intent\": \"write the fixed module\",\n   \"tool\": \"fs.write\",\n   \"arguments\": {\n    \"path\": \"src/paging.py\",\n    \"content\": \"\\\"\\\"\\\"Pagination.\\\"\\\"\\\"\\n\\n\\ndef page(items: list[int], number: int, size: int) -> list[int]:\\n    \\\"\\\"\\\"Page number (starting at 1) of the items; number or size below 1 is a ValueError.\\\"\\\"\\\"\\n    if number < 1 or size < 1:\\n        raise ValueError(\\\"page number and size start at 1\\\")\\n    start = (number - 1) * size\\n    return items[start : start + size]\\n\"\n   }\n  },\n  {\n   \"intent\": \"run the suite\",\n   \"tool\": \"test.run\",\n   \"arguments\": {\n    \"kind\": \"unit\"\n   }\n  }\n ],\n \"verification\": [\n  \"unit\"\n ]\n}"]

[files]
"src/__init__.py" = ""
"src/paging.py" = "\"\"\"Pagination.\"\"\"\n\n\ndef page(items: list[int], number: int, size: int) -> list[int]:\n    \"\"\"Page number (starting at 1) of the items; number or size below 1 is a ValueError.\"\"\"\n    start = number * size\n    return items[start : start + size]\n"
"tests/test_paging.py" = "import pytest\n\nfrom src.paging import page\n\n\ndef test_first_page() -> None:\n    assert page([1, 2, 3, 4, 5], 1, 2) == [1, 2]\n\n\ndef test_last_page() -> None:\n    assert page([1, 2, 3, 4, 5], 3, 2) == [5]\n\n\ndef test_zero_is_invalid() -> None:\n    with pytest.raises(ValueError):\n        page([1], 0, 2)\n"
