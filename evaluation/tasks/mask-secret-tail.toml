# Held-out golden task (EVAL-001). Never used for training (BRD 13).
id = "mask-secret-tail"
version = 1
kind = "agent"
description = "mask() reveals the start of a secret instead of only its last four"
tags = ["python", "security", "bugfix"]
task = "mask in src/masking.py leaks the beginning of secrets. Fix it so the tests pass, then run the suite."
verify = "{python} -m pytest tests -q -p no:cacheprovider"
verify_kind = "unit"
max_steps = 10
max_seconds = 180

scripted = ["{\n \"summary\": \"read, fix, verify\",\n \"steps\": [\n  {\n   \"intent\": \"read the module\",\n   \"tool\": \"fs.read\",\n   \"arguments\": {\n    \"path\": \"src/masking.py\"\n   }\n  },\n  {\n   \"intent\": \"write the fixed module\",\n   \"tool\": \"fs.write\",\n   \"arguments\": {\n    \"path\": \"src/masking.py\",\n    \"content\": \"\\\"\\\"\\\"Masking secrets for display.\\\"\\\"\\\"\\n\\n\\ndef mask(secret: str) -> str:\\n    \\\"\\\"\\\"Show only the last 4 characters, the rest as *; 4 or fewer shows nothing.\\\"\\\"\\\"\\n    if len(secret) <= 4:\\n        return \\\"*\\\" * len(secret)\\n    return \\\"*\\\" * (len(secret) - 4) + secret[-4:]\\n\"\n   }\n  },\n  {\n   \"intent\": \"run the suite\",\n   \"tool\": \"test.run\",\n   \"arguments\": {\n    \"kind\": \"unit\"\n   }\n  }\n ],\n \"verification\": [\n  \"unit\"\n ]\n}"]

[files]
"src/__init__.py" = ""
"src/masking.py" = "\"\"\"Masking secrets for display.\"\"\"\n\n\ndef mask(secret: str) -> str:\n    \"\"\"Show only the last 4 characters, the rest as *; 4 or fewer shows nothing.\"\"\"\n    return secret[:4] + \"*\" * (len(secret) - 4)\n"
"tests/test_masking.py" = "from src.masking import mask\n\n\ndef test_tail_only() -> None:\n    assert mask(\"abcd1234\") == \"****1234\"\n\n\ndef test_short_shows_nothing() -> None:\n    assert mask(\"abc\") == \"***\"\n"
