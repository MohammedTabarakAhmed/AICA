# Approved model registry (MM-001) and routing rules (MM-004, MM-009, MM-010).
#
# Credentials are NEVER stored here: api_key_env names the environment variable to read.
# The endpoint host must also appear in config/policy.toml [network].allowed_hosts (SAFE-005),
# so approving a model takes two deliberate edits, in two files, by whoever owns each.
#
# status  = approved | pending | deprecated | blocked  (MM-001)
#           only approved and deprecated may be used; deprecated is never auto-routed to.
# pinned  = true fixes the exact served version for reproducibility (MM-011); a pinned entry
#           may not name a moving alias such as "latest".
# adapter = an approved LoRA/domain adapter served under its own id (MM-014); version still
#           records the base model it sits on.

default = "deepseek-chat"

[[models]]
name = "deepseek-chat"
provider = "openai_compatible"
family = "deepseek"
version = "deepseek-chat"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
context_window = 128000
capabilities = ["chat", "streaming", "tools", "fim"]
timeout_seconds = 120.0
status = "approved"
enabled = true

# GLM (MM-005) through Z.ai's international endpoint, approved by the project owner on
# 2026-09-25. glm-4.7-flash is Z.ai's free tier, so it is also what serves work while no
# DeepSeek key is configured: the router falls back to it (MM-010). Kimi is a first-class
# family waiting on approval and deployment rather than on code, and stays disabled; the
# router skips a disabled or unapproved entry instead of failing over to it.
[[models]]
name = "glm-4.7-flash"
provider = "openai_compatible"
family = "glm"
version = "glm-4.7-flash"
base_url = "https://api.z.ai/api/paas/v4"
api_key_env = "GLM_API_KEY"
context_window = 128000
capabilities = ["chat", "streaming", "tools"]
timeout_seconds = 120.0
# The free tier answers HTTP 429 code 1305 ("temporarily overloaded") under load; retry it a
# few times before treating the model as unavailable.
max_retries = 4
status = "approved"
enabled = true
notes = "Z.ai free tier"

# GLM-4.7 reasons before answering by default, and the reasoning counts against max_tokens:
# with a small budget the visible answer comes back empty. Coding work here wants the answer.
[models.extra_body]
thinking = { type = "disabled" }

# Gemini and Groq free tiers, approved by the project owner on 2026-09-25. Model ids are from
# the providers' own model and pricing pages on that date: gemini-3.8-flash is Google's newest
# stable free model; on Groq, gpt-oss-120b is the strongest coding model and the
# second model is qwen3.8 (see below). Keys come from GEMINI_API_KEY and
# GROQ_API_KEY; the hosts are listed in config/policy.toml.
#
# Gemini 3 thinking cannot be turned off, only lowered, and like GLM the thinking counts against
# max_tokens, so it is set to the lowest level the OpenAI-compatible endpoint accepts.
[[models]]
name = "gemini-3.8-flash"
provider = "openai_compatible"
family = "gemini"
version = "gemini-3.8-flash"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
api_key_env = "GEMINI_API_KEY"
context_window = 1048576
capabilities = ["chat", "streaming", "tools"]
timeout_seconds = 120.0
max_retries = 3
status = "approved"
enabled = true
notes = "Google AI Studio free tier"

[models.extra_body]
reasoning_effort = "low"

# gpt-oss is a reasoning model and "low" is the least Groq accepts: with max_tokens=16 all 16
# tokens went to reasoning (finish_reason=length, empty answer). Give it a real budget.
[[models]]
name = "groq-gpt-oss-120b"
provider = "openai_compatible"
family = "gpt-oss"
version = "openai/gpt-oss-120b"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
context_window = 131072
capabilities = ["chat", "streaming", "tools"]
timeout_seconds = 120.0
max_retries = 3
status = "approved"
enabled = true
notes = "Groq free tier"

[models.extra_body]
reasoning_effort = "low"

# Groq's docs still listed llama-3.3-70b-versatile on 2026-09-25, but the account's /models
# did not, and a call answered 404 model_not_found. qwen3.8 is what the account serves besides
# gpt-oss; unlike gpt-oss its reasoning can be switched off, measured the same day.
[[models]]
name = "groq-qwen3.8-27b"
provider = "openai_compatible"
family = "qwen"
version = "qwen/qwen3.8-27b"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
context_window = 131072
capabilities = ["chat", "streaming", "tools"]
timeout_seconds = 120.0
max_retries = 3
status = "approved"
enabled = true
notes = "Groq free tier"

[models.extra_body]
reasoning_effort = "none"

# A local model through Ollama, approved by the project owner on 2026-09-25. It needs no key
# and does not leave the machine, so it keeps work possible when the free tier is overloaded
# and makes "the same task on a second model" a real comparison (EVAL-006).
#
# context_window is what Ollama *serves*, not what the weights support: qwen2.5-coder takes
# 32768 tokens, but Ollama loads it with 4096 unless the server sets OLLAMA_CONTEXT_LENGTH,
# and it truncates a longer prompt silently instead of failing. Declaring 32768 here would let
# the router send planning and review work that the model never sees in full. Raise both
# together. Measured with /api/ps on 2026-09-25 (Ollama 0.34.0, CPU only, digest dae161e27b0e).
[[models]]
name = "qwen2.5-coder-7b"
provider = "openai_compatible"
family = "qwen"
version = "qwen2.5-coder:7b"
base_url = "http://127.0.0.1:11434/v1"
context_window = 4096
capabilities = ["chat", "streaming", "tools"]
# CPU inference: a first call includes loading 4.7 GB of weights.
timeout_seconds = 300.0
status = "approved"
enabled = true
notes = "local Ollama, digest dae161e27b0e"

[[models]]
name = "kimi"
provider = "openai_compatible"
family = "kimi"
version = "moonshot-v1-128k"
base_url = "https://api.moonshot.cn/v1"
api_key_env = "KIMI_API_KEY"
context_window = 128000
capabilities = ["chat", "streaming", "tools"]
status = "pending"
enabled = false
notes = "not yet approved or deployed"

# ---------------------------------------------------------------------------- routing
# A rule says which model handles a kind of work. With one approved model every rule resolves
# to the same place, which is the point: the rules are here so adding a second model is a
# configuration change and not an agent-core change (MM-008).
[routing]
# Tried in order when the chosen model is unavailable - a 5xx, a timeout, a rate limit, or a
# credential that is not configured here (MM-010). Ordered by evidence from 2026-09-25:
# Groq qwen3.8 and GLM each completed a live end-to-end agent task, so they come first.
# Gemini answered but was overloaded (503) often enough that each attempt could cost ~45s of
# retries. gpt-oss answers chat but replies to the planner with a native tool call (HTTP 400,
# not a fallback trigger), so reaching it would end a planning chain; it is placed after the
# models that can plan. The local model is last: weakest, but needs no network, and skipped
# for planning and review, whose min_context it does not meet. Kimi is disabled; the router
# records each candidate it skips and why.
fallbacks = [
  "groq-qwen3.8-27b", "glm-4.7-flash", "gemini-3.8-flash", "groq-gpt-oss-120b",
  "qwen2.5-coder-7b", "kimi",
]

[[routing.rules]]
task = "completion"
model = "deepseek-chat"

[[routing.rules]]
task = "chat"
model = "deepseek-chat"

# Planning and review read a lot of code before they say anything, so they ask for room.
[[routing.rules]]
task = "planning"
model = "deepseek-chat"
min_context = 32000

[[routing.rules]]
task = "review"
model = "deepseek-chat"
min_context = 32000

# Nothing in the registry serves embeddings yet; retrieval uses the local hashing embedder
# until a model declares the "embeddings" capability, and the router refuses rather than
# quietly routing embedding work to a chat model.
